name: deploy production

# meridian.efolusi.com runs as a Cloudflare Worker serving static assets.
# Production deploys only from a v* tag on main, or a manual run on such a tag.
# publish.yml starts it on the new tag after a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read # require the exact-SHA checks run before deploying

concurrency:
  group: deploy-meridian-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'efolusi/meridian' && startsWith(github.ref, 'refs/tags/v')
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.sha }}
          # Full history and every tag: the build republishes browser/<version>/ of each release.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc

      - name: Require successful exact-SHA checks before production deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/require_successful_checks.mjs

      - name: Build and verify exact production source
        env:
          MERIDIAN_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          [[ "$(git rev-parse HEAD)" == "$MERIDIAN_RELEASE_SHA" ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$MERIDIAN_RELEASE_SHA" FETCH_HEAD
          npm ci --no-audit --no-fund
          npm run check
          git diff --exit-code
          node scripts/build_worker_assets.mjs "$MERIDIAN_RELEASE_SHA"

      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.157.0 deploy

      - name: Check the live release
        env:
          MERIDIAN_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          for attempt in 1 2 3 4 5 6; do
            live="$(curl -fsS "https://meridian.efolusi.com/meridian-release.txt?probe=$MERIDIAN_RELEASE_SHA" || true)"
            [[ "$live" == "$MERIDIAN_RELEASE_SHA" ]] && break
            sleep 10
          done
          [[ "$live" == "$MERIDIAN_RELEASE_SHA" ]]
          headers="$(curl -fsSI https://meridian.efolusi.com/site/DsSite.dc.html)"
          grep -qi '^x-content-type-options: nosniff' <<<"$headers"
          grep -qi '^cache-control: no-cache' <<<"$headers"
          [[ "$(curl -s -o /dev/null -w '%{http_code}' https://meridian.efolusi.com/no-such-page)" == 404 ]]
          # A published versioned script is immutable; a version that was never published is a plain 404.
          version="$(node -p "require('./package.json').version")"
          published="$(curl -sI "https://meridian.efolusi.com/browser/$version/marketing.js")"
          grep -qE '^HTTP/[0-9.]+ 200' <<<"$published"
          grep -qi '^cache-control: public, max-age=31536000, immutable' <<<"$published"
          grep -qi '^access-control-allow-origin: \*' <<<"$published"
          # The probe query gives a fresh cache key, so an older cached answer cannot hide the new headers.
          missing="$(curl -sI "https://meridian.efolusi.com/browser/0.0.0/marketing.js?probe=$MERIDIAN_RELEASE_SHA")"
          grep -qE '^HTTP/[0-9.]+ 404' <<<"$missing"
          ! grep -qi 'immutable' <<<"$missing"
          # Agents read the skill and the guidelines as text, not a download.
          curl -fsSI https://meridian.efolusi.com/skills/SKILL.md | grep -qi '^content-type: text/'
