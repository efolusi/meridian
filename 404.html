<!DOCTYPE html>
<html lang="en" data-shape="pill">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Halaman tidak ditemukan · Meridian</title>
<meta name="description" content="This page is not here. Halaman ini tidak ada.">
<script src="/browser/theme-init.js"></script>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<!-- The shared Meridian 404 page for static sites (MD110). Copy this file; guidelines/frameworks.md, "A 404 page on a static site", says how.
     Change three things: the mark (the img), the product name in the title, and the home href. Copy browser/theme-init.js beside it (MD148). To keep one language, delete the other section. -->
<main class="ef-notfound">
  <img class="ef-notfound__mark" src="/assets/favicon.svg" alt="" width="40" height="40">
  <p class="ef-notfound__code">404</p>
  <div class="ef-notfound__langs">
    <section class="ef-notfound__lang" lang="en" aria-labelledby="not-found-en">
      <h1 class="ef-page-title" id="not-found-en">Page not found</h1>
      <p>The link may be old, or the page was renamed. Go back to the home page and look from there.</p>
      <a class="ef-notfound__home" href="/">Back to home</a>
    </section>
    <section class="ef-notfound__lang" lang="id" aria-labelledby="not-found-id">
      <h2 class="ef-page-title" id="not-found-id">Halaman tidak ditemukan</h2>
      <p>Tautannya mungkin sudah usang, atau halamannya berganti nama. Kembali ke beranda.</p>
      <a class="ef-notfound__home" href="/">Kembali ke beranda</a>
    </section>
  </div>
</main>
</body>
</html>
