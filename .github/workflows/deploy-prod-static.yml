name: deploy production static site

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-meridian-prod-static
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, meridian-deploy]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Use exact NVM Node runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(tr -d '[:space:]' < .nvmrc)"
          [[ "$expected" == "22.23.2" ]]
          test -s "$HOME/.nvm/nvm.sh"
          source "$HOME/.nvm/nvm.sh"
          nvm use "$expected"
          actual="$(node -p 'process.versions.node')"
          [[ "$actual" == "$expected" ]]
          dirname "$(command -v node)" >> "$GITHUB_PATH"
          node --version
          npm --version

      - name: Build and verify exact production source
        env:
          MERIDIAN_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$MERIDIAN_RELEASE_SHA" ]]
          npm ci --no-audit --no-fund
          npm run check
          git diff --exit-code

      - name: Publish production release atomically
        env:
          MERIDIAN_RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/deploy-prod-static.sh "$MERIDIAN_RELEASE_SHA"
