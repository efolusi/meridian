name: deploy production static site

# Production deploys only from a v* tag on main, or a manual run on such a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-meridian-prod-static
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, efolusi-prod]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use exact NVM Node runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          expected="$(tr -d '[:space:]' < .nvmrc)"
          [[ "$expected" == "26.13.1" ]]
          test -s "$HOME/.nvm/nvm.sh"
          source "$HOME/.nvm/nvm.sh"
          nvm use "$expected"
          actual="$(node -p 'process.versions.node')"
          [[ "$actual" == "$expected" ]]
          dirname "$(command -v node)" >> "$GITHUB_PATH"
          node --version
          npm --version

      - name: Require successful exact-SHA checks before production deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/require_successful_checks.mjs

      - name: Build and verify exact production source
        env:
          MERIDIAN_RELEASE_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          [[ "$(git rev-parse HEAD)" == "$MERIDIAN_RELEASE_SHA" ]]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$MERIDIAN_RELEASE_SHA" FETCH_HEAD
          npm ci --no-audit --no-fund
          npm run check
          git diff --exit-code

      - name: Publish production release atomically
        env:
          MERIDIAN_RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/deploy-prod-static.sh "$MERIDIAN_RELEASE_SHA"
