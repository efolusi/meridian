name: publish

# Publishes @efolusi/meridian to npm using Trusted Publishing (OIDC), so no npm
# token is ever stored in this repository or in GitHub secrets. GitHub mints a
# short-lived identity token for this exact workflow, and npm verifies it against
# the trusted publisher configured on the package.
#
# This is a monorepo. It publishes FIVE packages in lockstep at one version —
# the @efolusi/meridian umbrella plus the standalone @efolusi/meridian-tokens,
# @efolusi/meridian-icons, @efolusi/meridian-guard and @efolusi/meridian-cli —
# and one independently
# versioned package, the MCP
# server @efolusi/meridian-mcp (version from mcp/package.json). Each is a separate
# npm package and needs its OWN
# one-time Trusted Publisher on npmjs.com, all pointing at the same source:
#   Provider    GitHub Actions
#   Repository  efolusi/meridian     (case sensitive)
#   Workflow    publish.yml
#   Environment npm-publish
# A misconfigured trusted publisher surfaces as a bare 404 on publish, which
# means "npm rejected the OIDC identity", not "package missing" — check the
# repository spelling, the workflow filename, and the environment name.
#
# First publish of a NEW package cannot use OIDC (npm only shows the Trusted
# Publisher settings once a package exists), so a brand-new sub-package needs one
# manual `npm publish ./packages/<name>/dist --access public` to create it,
# then its trusted publisher configured. After that the pipeline maintains it.
# The publish step is idempotent, so a version already on the registry is skipped
# and a partially-failed run re-runs cleanly.
#
# Three ways in:
#   push to main   — THE NORMAL PATH. When _ds_manifest.json carries a version
#                    that is not on the registry yet, this run re-checks every
#                    gate, publishes, then creates the vX.Y.Z tag and GitHub
#                    Release itself. A push whose version is already published
#                    is a no-op. Releasing is therefore just: bump the version,
#                    update the changelog, push (see RELEASING.md).
#   release        — cutting a GitHub Release by hand still publishes, with the
#                    extra guard that the tag must match the built version.
#   dispatch       — manual rehearsal; defaults to dry run. Non-dry requires
#                    the matching tag at HEAD.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate, but do not publish'
        type: boolean
        default: true

# Two version-bump pushes racing would both pass the registry check and publish
# out of order. Serialize; never cancel a publish mid-flight.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Fast gate so routine pushes don't spin up the whole publish machinery.
  decide:
    runs-on: [self-hosted, Linux, X64, efolusi-dev]
    timeout-minutes: 10
    outputs:
      go: ${{ steps.d.outputs.go }}
      version: ${{ steps.d.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: d
        run: |
          VERSION="$(node -p "require('./_ds_manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Monorepo: five packages move in lockstep at one version. Release if
          # ANY of them is missing this version — not just the umbrella. Checking
          # only the umbrella is how a run that published the umbrella but failed
          # on a sub-package (e.g. its trusted publisher wasn't set yet) could
          # never be finished by CI, forcing a manual publish. Now the next push
          # re-runs and completes whatever is still missing.
          GO=false
          for name in @efolusi/meridian @efolusi/meridian-tokens @efolusi/meridian-icons @efolusi/meridian-guard @efolusi/meridian-cli; do
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already on the registry"
            else
              echo "$name@$VERSION is not on the registry — this push will publish it"
              GO=true
            fi
          done
          # The MCP server (mcp/) is versioned independently of the lockstep five,
          # so it is gated on its own version — a push that only bumps mcp still
          # releases.
          MCPVER="$(node -p "require('./mcp/package.json').version")"
          if npm view "@efolusi/meridian-mcp@$MCPVER" version >/dev/null 2>&1; then
            echo "@efolusi/meridian-mcp@$MCPVER already on the registry"
          else
            echo "@efolusi/meridian-mcp@$MCPVER is not on the registry — this push will publish it"
            GO=true
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          [ "$GO" = true ] || echo "all lockstep packages already at $VERSION — nothing to release."

  # Everything that runs repository or dependency code: install, gates, pack.
  # Read-only token, no OIDC identity, so a compromised devDependency cannot
  # publish or push.
  build:
    needs: decide
    if: needs.decide.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # require the exact-SHA checks workflow before immutable publish
    outputs:
      version: ${{ steps.pack.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.2'

      - name: Require successful exact-SHA checks before publish
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/require_successful_checks.mjs

      - name: Install
        run: npm ci --no-audit --no-fund

      # A package that cannot pass its own checks has no business on a registry,
      # and a bad version cannot be unpublished after 72 hours. check_all.mjs is
      # the single gate list, and it also builds every dist/.
      - name: Gates, tests, build and package validation
        run: npm run check

      # The tag is the release's claim about what this is; the manifest is what
      # actually got built.
      - name: Tag and package version must agree
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG="$(node -p "require('./dist/package.json').version")"
          echo "release tag: $TAG"
          echo "package    : $PKG"
          if [ "$TAG" != "v$PKG" ]; then
            echo "::error::tag $TAG does not match package version $PKG."
            echo "Bump version in _ds_manifest.json (the npm build reads it from there), or retag."
            exit 1
          fi

      # A manual non-dry publish must be anchored to a tag nobody can lose.
      - name: Non-dry dispatch requires the matching tag at HEAD
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        run: |
          PKG="$(node -p "require('./dist/package.json').version")"
          git fetch --tags --quiet
          TAG_SHA="$(git rev-list -n1 "v$PKG" 2>/dev/null || true)"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ -z "$TAG_SHA" ]; then
            echo "::error::tag v$PKG does not exist. Tag the release commit first (see RELEASING.md)."
            exit 1
          fi
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::tag v$PKG points at $TAG_SHA but this run builds $HEAD_SHA."
            exit 1
          fi
          echo "tag v$PKG is at HEAD"

      # Only an all-published run is an error ("you forgot to bump the version");
      # a lagging sub-package is legitimate work for the idempotent publish job.
      - name: At least one package must still need publishing
        run: |
          NEED=false
          for dir in dist packages/tokens/dist packages/icons/dist packages/guard/dist mcp packages/cli/dist; do
            NAME="$(node -p "require('./$dir/package.json').name")"
            PKG="$(node -p "require('./$dir/package.json').version")"
            if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
              echo "$NAME@$PKG already published — will be skipped"
            else
              echo "$NAME@$PKG not yet on the registry — will publish"
              NEED=true
            fi
          done
          if [ "$NEED" != true ]; then
            echo "::error::every package is already on the registry at this version. npm versions are immutable; bump the version."
            exit 1
          fi

      # The exact tarballs the publish job will upload, with their checksums.
      # packages.tsv lists file, name and version so publish never reads the repo.
      - name: Pack the verified packages
        id: pack
        run: |
          OUT="$RUNNER_TEMP/npm-packages"
          mkdir -p "$OUT"
          : > "$OUT/packages.tsv"
          # The CLI goes last: until its first manual publish and trusted publisher
          # exist (RELEASING.md), its 404 must not block the packages before it.
          for d in dist packages/tokens/dist packages/icons/dist packages/guard/dist mcp packages/cli/dist; do
            echo "== $d"
            FILE="$(npm pack "./$d" --pack-destination "$OUT" --json | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0, "utf8"))[0].filename)')"
            NAME="$(node -p "require('./$d/package.json').name")"
            VER="$(node -p "require('./$d/package.json').version")"
            printf '%s\t%s\t%s\n' "$FILE" "$NAME" "$VER" >> "$OUT/packages.tsv"
          done
          (cd "$OUT" && sha256sum ./*.tgz packages.tsv > SHA256SUMS)
          cat "$OUT/packages.tsv" "$OUT/SHA256SUMS"
          echo "version=$(node -p "require('./dist/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages
          if-no-files-found: error
          retention-days: 7

      - name: Dry run finished
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo "Dry run only. The packages above were built and verified; nothing was published."

  # The only job that can mint the npm OIDC identity. It runs no repository or
  # dependency code: it checks the tarballs against build's checksums and
  # publishes them. Its environment must match the npm trusted publisher.
  publish:
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
    # GitHub-hosted on purpose: npm Trusted Publishing (OIDC) does not support self-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.2'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer; node 22 still bundles 10.x.
      # Exact version: this job can mint an npm publish identity.
      - name: Use an npm that understands trusted publishing
        run: |
          npm install -g npm@11.21.1
          npm --version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages

      - name: Tarballs match what build verified
        working-directory: ${{ runner.temp }}/npm-packages
        run: sha256sum --check --strict SHA256SUMS

      # No NODE_AUTH_TOKEN: the OIDC identity is the credential. Idempotent, so
      # a run that failed partway re-runs cleanly despite npm's immutability.
      - name: Publish
        working-directory: ${{ runner.temp }}/npm-packages
        run: |
          while IFS="$(printf '\t')" read -r file name ver; do
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver already published — skipping"
            else
              echo "publishing $name@$ver from $file"
              npm publish "./$file" --access public --provenance
            fi
          done < packages.tsv

  # Tag and GitHub Release for the auto path. Releases created with GITHUB_TOKEN
  # do not trigger other workflows, so this cannot re-enter the release path.
  release:
    needs: [build, publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Tag and cut the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PKG: ${{ needs.build.outputs.version }}
        run: |
          # A run that only completes a lagging sub-package finds the Release
          # already made by the run that shipped the umbrella.
          if gh release view "v$PKG" >/dev/null 2>&1; then
            echo "v$PKG release already exists — nothing to cut"
            exit 0
          fi
          NOTES="$RUNNER_TEMP/notes.md"
          python3 - "$PKG" > "$NOTES" <<'EOF'
          import re, sys
          ver = sys.argv[1]
          t = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(rf'^## {re.escape(ver)}[^\n]*\n(.*?)(?=^## |\Z)', t, re.S | re.M)
          print(m.group(1).strip() if m else f'Meridian {ver}. Details in CHANGELOG.md.')
          EOF
          # gh tags the published commit via the API; a leftover tag must be at this SHA.
          if TAG_LINES="$(git ls-remote --exit-code origin "refs/tags/v$PKG")"; then
            # An annotated tag lists its commit on the peeled ^{} line.
            TAG_SHA="$(printf '%s\n' "$TAG_LINES" | awk '$2 ~ /\^\{\}$/ { peeled = $1 } $2 !~ /\^\{\}$/ { ref = $1 } END { print (peeled != "" ? peeled : ref) }')"
            if [ "$TAG_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::tag v$PKG exists at $TAG_SHA, not at the published commit $GITHUB_SHA."
              exit 1
            fi
            gh release create "v$PKG" --verify-tag --title "Meridian $PKG" --notes-file "$NOTES"
          else
            gh release create "v$PKG" --target "$GITHUB_SHA" --title "Meridian $PKG" --notes-file "$NOTES"
          fi
          echo "released v$PKG"
