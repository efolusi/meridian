# Managed by the Meridian production deploy. Do not hand-edit on the server.
server {
    listen 80;
    listen [::]:80;
    server_name meridian.efolusi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name meridian.efolusi.com;
    include snippets/efolusi-ssl.conf;

    root /var/www/efolusi/meridian-prod/current;
    index index.html;
    error_page 404 /404.html;

    add_header X-Meridian-Environment production always;

    location = /meridian-release.txt {
        default_type text/plain;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Mirrors _headers: site runtime, bundle, styles and tokens must never go
    # stale. support.js re-fetches location.href on *.dc.html pages, so a
    # heuristic-cached copy renders an old release. add_header here replaces
    # the server-level header, so the environment header is repeated.
    location ~ ^/(site/|tokens/|_ds_bundle\.js$|styles\.css$|landing\.css$) {
        add_header X-Meridian-Environment production always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Fonts are self-hosted (tokens/fonts.css @font-face) and the filenames are
    # stable, so a year of caching is right but "immutable" is not: replacing a
    # face in place must still be able to reach a returning visitor.
    location ^~ /assets/fonts/ {
        add_header X-Meridian-Environment production always;
        add_header Cache-Control "public, max-age=31536000" always;
        try_files $uri =404;
    }

    # Everything else under /assets/ (icons, logos, favicon, social image): a
    # week. Long enough to stop revalidating on every visit, short enough that
    # a favicon or social image without a ?v= query still propagates on its own.
    location ^~ /assets/ {
        add_header X-Meridian-Environment production always;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    location ~ /\.git {
        deny all;
        return 404;
    }
}
