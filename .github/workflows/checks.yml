name: checks

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

# Runner choice. efolusi-dev is an org-wide self-hosted host whose `deploy` user
# also publishes dev-meridian.efolusi.com, is in the Docker group, and holds
# other products' environment files. This repository is public, so a pull
# request from a fork is untrusted code (package.json scripts, tests, gates)
# and must never reach that host: it runs on a GitHub-hosted runner instead.
# Only pushes and same-repository branches (writers only) use efolusi-dev. The
# expression fails closed: a fork whose head repo was deleted still goes
# hosted. tests/ci-security.test.mjs holds this contract.

jobs:
  gates:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","efolusi-dev"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Contrast (WCAG AA token pairs)
        run: python3 scripts/check_contrast.py

      - name: Runtime copies (support.js / ds-base.js drift)
        run: python3 scripts/check_runtime_copies.py

      - name: Relative paths resolve
        run: python3 scripts/check_paths.py

      - name: Registry is in sync with its generator
        run: |
          python3 scripts/build_registry.py
          git diff --exit-code -- site/registry.json site/registry

      - name: Generated tokens and interfaces are in sync
        run: |
          python3 scripts/build_tokens.py
          python3 scripts/build_interfaces.py
          git diff --exit-code -- tokens.json tailwind.preset.js site/interfaces.json

      - name: Manifest inventories match the bundle and tokens
        run: python3 scripts/sync_manifest.py --check

      - name: Docs registry matches the manifest
        run: node scripts/check_docs_registry.mjs

      - name: Adherence rules match the manifest
        run: node scripts/check_adherence_manifest.mjs

      - name: No dead interactive controls
        run: python3 scripts/check_dead_controls.py

      - name: No new raw colour literals
        run: python3 scripts/check_token_adherence.py

      - name: Logical CSS direction safety
        run: python3 scripts/check_logical_css.py

      - name: Hover does not add underlines
        run: node scripts/check_hover_decoration.mjs

      - name: Template prop and attribute contracts
        run: python3 scripts/check_template_props.py

      # Fast pre-check: the header's recorded hashes vs the sources on disk.
      - name: Bundle source hashes match source files
        run: python3 scripts/check_bundle_hashes.py

      # The real gate: recompile from source and require the committed artifact to
      # match byte for byte. This is reproduction, not self-attestation — the same
      # standard the registry and token generators are already held to.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.2'
      - name: Install build dependency
        run: npm ci --no-audit --no-fund
      - name: Computed contrast helper
        run: node --test scripts/contrast.test.mjs
      - name: _ds_bundle.js is reproducible from source
        run: node scripts/build_bundle.mjs --check

      # Keyboard and wiring contracts, run against the component sources rather
      # than the bundle. This is the one gate an outside contributor can turn
      # green without understanding the compiler.
      - name: Unit tests
        run: npm test

      # The ESM package must build and import for real, not just compile.
      - name: npm package builds and imports
        run: |
          node scripts/build_npm.mjs
          node scripts/check_npm_package.mjs

      # The .d.ts layer is hand-maintained, so nothing else forces it to stay
      # valid. Runs after the npm build so the dist/ barrel pass has something
      # to check.
      - name: Types compile (components and the package barrel)
        run: node scripts/check_types.mjs

  smoke:
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","efolusi-dev"]') || 'ubuntu-24.04' }}
    env:
      # Browsers and their system libs come from the Playwright image: the
      # self-hosted runner user has no sudo, so `install --with-deps` cannot
      # run. Same pattern as sanctum CI (docker run as the runner uid, so the
      # workspace never gets root-owned files). Tag matches playwright@1.48.0;
      # the digest pins the exact image, so a re-pushed tag cannot change what
      # runs with the workspace mounted.
      PW_IMAGE: mcr.microsoft.com/playwright:v1.48.0-noble@sha256:d1e54d0cbb2d6b125b0bbd32536b2ed53953ea78159c27a56f22b10058e733c4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22.23.2'
      # smoke_headless.mjs does `import { chromium } from 'playwright'`, so the
      # package has to be resolvable from the repo. `npx --package=X node script`
      # does not put X on the module search path, which is why this job failed
      # silently for weeks while the gates job stayed green. Install it for real.
      - name: Install Playwright package (browsers come from the image)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.0
          docker pull -q "$PW_IMAGE"
          {
            echo '#!/bin/sh'
            echo 'exec docker run --rm --network host --ipc host --user "$(id -u):$(id -g)" -e HOME=/tmp -e BASE -e SHOTS -e BUTTON_SHOTS -e DIRECTION -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$PW_IMAGE" node "$@"'
          } > "$RUNNER_TEMP/pw-node"
          chmod +x "$RUNNER_TEMP/pw-node"
      - name: Button anchor cascade and state parity
        run: BUTTON_SHOTS="$RUNNER_TEMP/button-shots" "$RUNNER_TEMP/pw-node" scripts/check_button_cascade.mjs
      - name: Upload button interaction receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: button-interaction-receipts
          path: ${{ runner.temp }}/button-shots
          if-no-files-found: error
      - name: Serve repo and run headless smoke
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 &
          SERVER=$!
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8000/site/_smoke.html >/dev/null && break || sleep 0.5; done
          set +e
          BASE=http://127.0.0.1:8000 SHOTS="$RUNNER_TEMP/shots" "$RUNNER_TEMP/pw-node" scripts/smoke_headless.mjs
          CODE=$?
          if [ "$CODE" -eq 0 ]; then
            BASE=http://127.0.0.1:8000 DIRECTION=rtl "$RUNNER_TEMP/pw-node" scripts/smoke_headless.mjs
            CODE=$?
          fi
          if [ "$CODE" -eq 0 ]; then
            BASE=http://127.0.0.1:8000 "$RUNNER_TEMP/pw-node" scripts/smoke_starters.mjs
            CODE=$?
          fi
          set -e
          kill $SERVER 2>/dev/null || true
          exit $CODE

      # Compares against tests/__shots__ baselines; skips loudly while none
      # exist. Baselines are made by the update-visual-baselines workflow so
      # they always come from this same runner platform.
      - name: Visual regression (group screenshots vs baselines)
        run: SHOTS="$RUNNER_TEMP/shots" "$RUNNER_TEMP/pw-node" scripts/check_visual.mjs

      - name: Upload shots and diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
