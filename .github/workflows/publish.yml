name: publish

# Publishes @efolusi/meridian to npm using Trusted Publishing (OIDC), so no npm
# token is ever stored in this repository or in GitHub secrets. GitHub mints a
# short-lived identity token for this exact workflow, and npm verifies it against
# the trusted publisher configured on the package.
#
# This is a monorepo. It publishes THREE packages in lockstep at one version —
# the @efolusi/meridian umbrella plus the standalone @efolusi/meridian-tokens and
# @efolusi/meridian-icons — and one INDEPENDENTLY-versioned package, the MCP
# server @efolusi/meridian-mcp (version from mcp/package.json). Each is a separate
# npm package and needs its OWN
# one-time Trusted Publisher on npmjs.com, all pointing at the same source:
#   Provider    GitHub Actions
#   Repository  efolusi/meridian     (case sensitive)
#   Workflow    publish.yml
#   Environment npm-publish
# A misconfigured trusted publisher surfaces as a bare 404 on publish, which
# means "npm rejected the OIDC identity", not "package missing" — check the
# repository spelling, the workflow filename, and the environment name.
#
# First publish of a NEW package cannot use OIDC (npm only shows the Trusted
# Publisher settings once a package exists), so a brand-new sub-package needs one
# manual `npm publish ./packages/<name>/dist --access public` to create it,
# then its trusted publisher configured. After that the pipeline maintains it.
# The publish step is idempotent, so a version already on the registry is skipped
# and a partially-failed run re-runs cleanly.
#
# Three ways in:
#   push to main   — THE NORMAL PATH. When _ds_manifest.json carries a version
#                    that is not on the registry yet, this run re-checks every
#                    gate, publishes, then creates the vX.Y.Z tag and GitHub
#                    Release itself. A push whose version is already published
#                    is a no-op. Releasing is therefore just: bump the version,
#                    update the changelog, push (see RELEASING.md).
#   release        — cutting a GitHub Release by hand still publishes, with the
#                    extra guard that the tag must match the built version.
#   dispatch       — manual rehearsal; defaults to dry run. Non-dry requires
#                    the matching tag at HEAD.

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and validate, but do not publish'
        type: boolean
        default: true

# Two version-bump pushes racing would both pass the registry check and publish
# out of order. Serialize; never cancel a publish mid-flight.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Fast gate so routine pushes don't spin up the whole publish machinery.
  decide:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.d.outputs.go }}
      version: ${{ steps.d.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: d
        run: |
          VERSION="$(node -p "require('./_ds_manifest.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Monorepo: three packages move in lockstep at one version. Release if
          # ANY of them is missing this version — not just the umbrella. Checking
          # only the umbrella is how a run that published the umbrella but failed
          # on a sub-package (e.g. its trusted publisher wasn't set yet) could
          # never be finished by CI, forcing a manual publish. Now the next push
          # re-runs and completes whatever is still missing.
          GO=false
          for name in @efolusi/meridian @efolusi/meridian-tokens @efolusi/meridian-icons; do
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already on the registry"
            else
              echo "$name@$VERSION is not on the registry — this push will publish it"
              GO=true
            fi
          done
          # The MCP server (mcp/) is versioned independently of the lockstep three,
          # so it is gated on its own version — a push that only bumps mcp still
          # releases.
          MCPVER="$(node -p "require('./mcp/package.json').version")"
          if npm view "@efolusi/meridian-mcp@$MCPVER" version >/dev/null 2>&1; then
            echo "@efolusi/meridian-mcp@$MCPVER already on the registry"
          else
            echo "@efolusi/meridian-mcp@$MCPVER is not on the registry — this push will publish it"
            GO=true
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
          [ "$GO" = true ] || echo "all three packages already at $VERSION — nothing to release."

  publish:
    needs: decide
    if: needs.decide.outputs.go == 'true'
    runs-on: ubuntu-latest
    # Gives the publish a reviewable gate in repo settings, and scopes the OIDC
    # claim. Must match the Environment named in the trusted publisher config.
    environment: npm-publish
    permissions:
      contents: write # the auto path pushes the tag and creates the Release
      id-token: write # required for OIDC; without it npm cannot verify the workflow

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer; node 22 still bundles 10.x.
      - name: Use an npm that understands trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install
        run: npm ci --no-audit --no-fund

      # A package that cannot pass its own checks has no business on a registry,
      # and a bad version cannot be unpublished after 72 hours. check_all.mjs is
      # the single source of the gate list (it also builds dist/); keeping a
      # second hand-maintained list here is how publish and CI drift apart.
      - name: Gates, tests, build and package validation
        run: npm run check

      # The tag is the release's claim about what this is; the manifest is what
      # actually got built. If they disagree, the wrong thing is about to ship
      # under a name people will pin.
      - name: Tag and package version must agree
        if: github.event_name == 'release'
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PKG="$(node -p "require('./dist/package.json').version")"
          echo "release tag: $TAG"
          echo "package    : $PKG"
          if [ "$TAG" != "v$PKG" ]; then
            echo "::error::tag $TAG does not match package version $PKG."
            echo "Bump version in _ds_manifest.json (the npm build reads it from there), or retag."
            exit 1
          fi

      # A manual non-dry publish must still be anchored to a tag: an untagged
      # tree reaching the registry means a version nobody can check out later.
      # (The push path creates its tag itself, after the publish succeeds.)
      - name: Non-dry dispatch requires the matching tag at HEAD
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == false
        run: |
          PKG="$(node -p "require('./dist/package.json').version")"
          git fetch --tags --quiet
          TAG_SHA="$(git rev-list -n1 "v$PKG" 2>/dev/null || true)"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ -z "$TAG_SHA" ]; then
            echo "::error::tag v$PKG does not exist. Tag the release commit first (see RELEASING.md)."
            exit 1
          fi
          if [ "$TAG_SHA" != "$HEAD_SHA" ]; then
            echo "::error::tag v$PKG points at $TAG_SHA but this run builds $HEAD_SHA."
            exit 1
          fi
          echo "tag v$PKG is at HEAD"

      # Republishing an existing version fails at the registry anyway; failing
      # here says why, instead of surfacing a bare 403. On the push path this
      # re-checks what `decide` saw, after the slow steps — closing the race.
      - name: At least one package must still need publishing
        # Monorepo-aware immutability guard. The publish step below is idempotent
        # (already-published packages are skipped), so a run where the umbrella is
        # already up but a sub-package lags is legitimate work, not an error. Only
        # a run where ALL THREE are already on the registry has nothing to do —
        # that is the "you forgot to bump the version" case, and it hard-fails.
        run: |
          NEED=false
          for dir in dist packages/tokens/dist packages/icons/dist mcp; do
            NAME="$(node -p "require('./$dir/package.json').name")"
            PKG="$(node -p "require('./$dir/package.json').version")"
            if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
              echo "$NAME@$PKG already published — will be skipped"
            else
              echo "$NAME@$PKG not yet on the registry — will publish"
              NEED=true
            fi
          done
          if [ "$NEED" != true ]; then
            echo "::error::every package is already on the registry at this version. npm versions are immutable; bump the version."
            exit 1
          fi

      - name: Pack (what would ship)
        # The three lockstep packages (umbrella + two sub-packages, each built by
        # npm run check above) plus the independently-versioned MCP server (mcp/,
        # plain .mjs, no build). Its `files` field ships only server.mjs + README.
        run: |
          for d in dist packages/tokens/dist packages/icons/dist mcp; do
            echo "== $d"
            npm pack "./$d" --dry-run
          done

      - name: Publish
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run == false
        # No NODE_AUTH_TOKEN: the OIDC identity above is the credential.
        # Provenance is attached automatically. Each publish is idempotent: a
        # version already on the registry is skipped, so a run that failed
        # partway (a sub-package's trusted publisher not yet set) re-runs cleanly
        # instead of deadlocking on npm's immutability.
        run: |
          publish_if_new() {
            local dir="$1"
            local name ver
            name="$(node -p "require('./$dir/package.json').name")"
            ver="$(node -p "require('./$dir/package.json').version")"
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver already published — skipping"
            else
              echo "publishing $name@$ver from $dir"
              npm publish "./$dir" --access public
            fi
          }
          publish_if_new dist
          publish_if_new packages/tokens/dist
          publish_if_new packages/icons/dist
          # Independently versioned; publishes only when mcp/package.json carries a
          # version not yet on the registry. Needs its own trusted publisher.
          publish_if_new mcp

      # The auto path finishes the paperwork the human used to do. Releases
      # created with GITHUB_TOKEN do not trigger other workflows, so this cannot
      # re-enter the `release` path and double-publish.
      - name: Tag and cut the GitHub Release (auto path)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PKG="$(node -p "require('./dist/package.json').version")"
          # Idempotent: a run that only completes a lagging sub-package finds the
          # tag and Release already made by the run that shipped the umbrella, so
          # `git tag` would otherwise abort the whole job. Skip when it exists.
          if gh release view "v$PKG" >/dev/null 2>&1 || git rev-parse -q --verify "refs/tags/v$PKG" >/dev/null; then
            echo "v$PKG tag/release already exists — nothing to cut"
            exit 0
          fi
          python3 - "$PKG" > /tmp/notes.md <<'EOF'
          import re, sys
          ver = sys.argv[1]
          t = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(rf'^## {re.escape(ver)}[^\n]*\n(.*?)(?=^## |\Z)', t, re.S | re.M)
          print(m.group(1).strip() if m else f'Meridian {ver}. Details in CHANGELOG.md.')
          EOF
          git tag "v$PKG"
          git push origin "v$PKG"
          gh release create "v$PKG" --title "Meridian $PKG" --notes-file /tmp/notes.md
          echo "released v$PKG"

      - name: Dry run finished
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo "Dry run only. Nothing was published."
