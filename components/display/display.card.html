<!-- @dsCard group="Components" viewport="700x1290" name="Display" subtitle="Card, Badge, Avatar, TreeList, Collapsible, ScrollArea, Carousel, Resizable" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body style="background:var(--surface-page)">
<div id="root"></div>
<script type="text/babel">
const { Card, CardAction, CardContent, CardDescription, CardFooter, CardHeader, CardTitle, Badge, Tag, Avatar, AvatarFallback, AvatarGroup, Button, Kbd, Divider, Accordion, AccordionItem, AccordionTrigger, AccordionContent, Link, Toolbar, Item, ItemActions, ItemContent, ItemDescription, ItemGroup, ItemMedia, ItemSeparator, ItemTitle, Icon, TreeList, Switch, Collapsible, CollapsibleTrigger, CollapsibleContent, AspectRatio, ScrollArea, Carousel, CarouselContent, CarouselItem, CarouselPrevious, CarouselNext, ResizablePanelGroup, ResizablePanel, ResizableHandle } = window.EfolusiDesignSystem_4ffc3d;
const lbl = { fontSize: 11, fontWeight: 600, letterSpacing: '0.06em', textTransform: 'uppercase', color: 'var(--text-muted)', marginBottom: 8 };
function Demo() {
  const [tags, setTags] = React.useState(['Billing', 'API']);
  const [view, setView] = React.useState('list');
  return (
    <div style={{ padding: 20, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 18 }}>
      <Card><CardHeader><CardTitle>Invite your team</CardTitle><CardDescription>Efolusi works better together.</CardDescription><CardAction><Button size="sm" variant="secondary" iconLeft="plus">Invite</Button></CardAction></CardHeader><CardContent><AvatarGroup>
          <Avatar><AvatarFallback>AO</AvatarFallback></Avatar>
          <Avatar><AvatarFallback>FA</AvatarFallback></Avatar>
          <Avatar><AvatarFallback>JP</AvatarFallback></Avatar>
        </AvatarGroup></CardContent><CardFooter><span style={{ fontSize: 13, color: 'var(--text-muted)' }}>3 of 5 seats used</span></CardFooter></Card>
      <div>
        <div style={lbl}>Badge · Tag</div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <Badge>Neutral</Badge><Badge tone="accent">Beta</Badge><Badge tone="success" dot>Active</Badge>
          <Badge tone="warning" dot>Degraded</Badge><Badge tone="danger">Overdue</Badge><Badge tone="brand">New</Badge>
        </div>
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 10 }}>
          {tags.map(t => <Tag key={t} icon="funnel" onRemove={() => setTags(tags.filter(x => x !== t))}>{t}</Tag>)}
          <Tag icon="plus" onClick={() => setTags([...tags, 'Tag ' + (tags.length + 1)])}>Add filter</Tag>
        </div>
        <div style={{ ...lbl, marginTop: 14 }}>Link</div>
        <div style={{ display: 'flex', gap: 16, alignItems: 'center', fontSize: 14 }}>
          <Link href="#">Inline link</Link>
          <Link external href="#">API status</Link>
          <Link standalone href="#">Explore Agent</Link>
        </div>
        <div style={{ ...lbl, marginTop: 14 }}>Toolbar</div>
        <Toolbar label="View" value={view} onChange={setView} items={[
          { id: 'list', icon: 'menu', tip: 'List' },
          { id: 'board', icon: 'layout-dashboard', tip: 'Board' },
          { id: 'grid', icon: 'square', tip: 'Grid' },
          'separator',
          { id: 'export', icon: 'download', tip: 'Export' },
        ]} />
      </div>
      <div>
        <div style={lbl}>Item</div>
        <Card style={{ '--card-spacing': '6px' }}><CardContent>
          <ItemGroup>
            <Item size="sm"><ItemMedia variant="icon"><Icon name="bell" /></ItemMedia><ItemContent><ItemTitle>Usage alerts</ItemTitle><ItemDescription>At 80% of plan</ItemDescription></ItemContent><ItemActions><Switch defaultChecked /></ItemActions></Item>
            <ItemSeparator />
            <Item size="sm"><ItemMedia><Avatar><AvatarFallback>AO</AvatarFallback></Avatar></ItemMedia><ItemContent><ItemTitle>Ada Obi</ItemTitle><ItemDescription>Owner</ItemDescription></ItemContent><ItemActions>2m ago</ItemActions></Item>
          </ItemGroup>
        </CardContent></Card>
      </div>
      <div>
        <div style={lbl}>TreeList</div>
        <Card style={{ '--card-spacing': '8px' }}><CardContent>
          <TreeList nodes={[
            { id: 'ws', label: 'Acme Workspace', icon: 'folder', children: [
              { id: 'agent', label: 'AI agents', icon: 'sparkles', count: 12 },
              { id: 'infra', label: 'Infrastructure', icon: 'server', children: [
                { id: 'prod', label: 'production', icon: 'database', count: 4 },
                { id: 'stage', label: 'staging', icon: 'database', count: 2 },
              ]},
            ]},
          ]} />
        </CardContent></Card>
      </div>
      <div style={{ gridColumn: 'span 2', display: 'flex', flexDirection: 'column', gap: 14 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 13, color: 'var(--text-secondary)' }}>Quick search anywhere <Kbd>⌘</Kbd><Kbd>K</Kbd></div>
        <Divider label="or" />
        <Accordion type="single" defaultValue="billing" collapsible>
          <AccordionItem value="billing"><AccordionTrigger>How does billing work?</AccordionTrigger><AccordionContent>Per seat, monthly. Usage is metered daily and invoiced on the 1st.</AccordionContent></AccordionItem>
          <AccordionItem value="cancel"><AccordionTrigger>Can I cancel anytime?</AccordionTrigger><AccordionContent>Yes — your workspace stays readable forever.</AccordionContent></AccordionItem>
        </Accordion>
      </div>
      <div>
        <div style={lbl}>Collapsible</div>
        <Card style={{ '--card-spacing': '14px' }}><CardContent>
          <Collapsible defaultOpen>
            <CollapsibleTrigger className="ef-collapsible__trigger"><Icon name="chevron-right" size={16} />Advanced settings</CollapsibleTrigger>
            <CollapsibleContent style={{ padding: '2px 0 10px 24px' }}><div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
              <Switch size="sm" defaultChecked label="Verbose logs" />
              <Switch size="sm" label="Beta features" />
            </div></CollapsibleContent>
          </Collapsible>
        </CardContent></Card>
        <div style={{ ...lbl, marginTop: 14 }}>ScrollArea</div>
        <Card><CardContent style={{ paddingInline: 0, marginBlock: 'calc(var(--card-spacing) * -1)' }}>
          <ScrollArea maxHeight={110}>
            <div style={{ padding: 12, display: 'flex', flexDirection: 'column', gap: 8, fontFamily: 'var(--font-mono)', fontSize: 12 }}>
              {['agent.run started', 'plan drafted (4 steps)', 'tool: search_flights', 'tool: book_hotel', 'review requested', 'approved by Ada', 'agent.run finished', 'artifact saved', 'notified #ops', 'usage: 1,240 tokens'].map((l, i) => <span key={i} style={{ color: 'var(--text-secondary)' }}>{l}</span>)}
            </div>
          </ScrollArea>
        </CardContent></Card>
      </div>
      <div>
        <div style={lbl}>AspectRatio</div>
        <AspectRatio ratio={16 / 9}>
          <div style={{ width: '100%', height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', background: 'var(--brand-950)', color: 'var(--brand-100)', borderRadius: 'var(--radius-md)', fontFamily: 'var(--font-mono)', fontSize: 13 }}>16 : 9</div>
        </AspectRatio>
      </div>
      <div style={{ gridColumn: 'span 2', padding: '0 14px' }}>
        <div style={lbl}>Carousel</div>
        <Carousel aria-label="Product modules">
          <CarouselContent>
            {['Analytics', 'Billing', 'Identity', 'Storage', 'Search', 'Webhooks'].map(p => <CarouselItem key={p} style={{ flexBasis: 200 }}><Card><CardHeader><CardTitle>{p}</CardTitle><CardDescription>Module</CardDescription></CardHeader><CardContent><div style={{ height: 34 }} /></CardContent></Card></CarouselItem>)}
          </CarouselContent>
          <CarouselPrevious />
          <CarouselNext />
        </Carousel>
      </div>
      <div style={{ gridColumn: 'span 2' }}>
        <div style={lbl}>Resizable</div>
        <div style={{ height: 140, border: '1px solid var(--border-default)', borderRadius: 'var(--radius-md)', overflow: 'hidden' }}>
          <ResizablePanelGroup>
            <ResizablePanel defaultSize={35}><div style={{ padding: 12, fontSize: 13, color: 'var(--text-secondary)', background: 'var(--surface-card)', height: '100%' }}>Drag the handle →</div></ResizablePanel>
            <ResizableHandle withHandle />
            <ResizablePanel><div style={{ padding: 12, fontSize: 13, color: 'var(--text-secondary)', height: '100%' }}>Keyboard: focus the handle, then arrow keys.</div></ResizablePanel>
          </ResizablePanelGroup>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
