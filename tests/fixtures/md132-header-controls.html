<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD132 header controls</title>
<link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-page);color:var(--text-primary);font-family:var(--font-sans)}pre{white-space:pre-wrap;margin:16px}</style>
<script src="../../node_modules/react/umd/react.production.min.js"></script>
<script src="../../node_modules/react-dom/umd/react-dom.production.min.js"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
<!-- MD132: the three header controls (ThemeToggle, LanguageSwitch, the SiteHeader menu button) share one size
     (--control-h-md: 36 px with a mouse, 44 px at a coarse pointer), one pill shape, no border and no box-shadow at
     rest or on hover, and a hover fill only where a pointer can hover. window.__open() opens the menu panel of a phone
     width first. window.__MD132__ holds the measured boxes and
     the computed border, box-shadow and background of each control at rest; window.__hover(selector) reports the same
     with the pointer over it (move the real pointer there first: the fixture only reads). Served by hand:
     python3 -m http.server from the repository root, then open /tests/fixtures/md132-header-controls.html. -->
<div id="root"></div>
<pre id="out"></pre>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');
  const { SiteHeader, ThemeToggle, LanguageSwitch } = window.EfolusiDesignSystem_4ffc3d;
  const h = React.createElement;
  const languages = [
    { code: 'id', label: 'ID', href: '/id', name: 'Bahasa Indonesia' },
    { code: 'en', label: 'EN', href: '/en', name: 'English' },
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(
    h(SiteHeader, {
      brand: 'Meridian',
      links: [{ label: 'Docs', href: '/docs' }, { label: 'Components', href: '/components' }],
      actions: [h(LanguageSwitch, { key: 'l', languages, current: 'en' }), h(ThemeToggle, { key: 't' })],
    }));
  const px = (v) => Math.round(parseFloat(v) * 100) / 100;
  const read = (el) => {
    const r = el.getBoundingClientRect();
    const cs = getComputedStyle(el);
    return {
      w: px(r.width), h: px(r.height), shown: r.width > 0,
      border: `${cs.borderTopWidth} ${cs.borderTopStyle} ${cs.borderTopColor}`,
      boxShadow: cs.boxShadow, background: cs.backgroundColor, backgroundImage: cs.backgroundImage === 'none' ? 'none' : 'set',
      radius: cs.borderTopLeftRadius,
    };
  };
  const SELECTORS = { toggle: '.ef-theme-toggle', language: '.ef-language-switch__item:not([aria-current])', languageCurrent: '.ef-language-switch__item[aria-current]', menu: '.ef-site-header__menu' };
  window.__measureMD132 = () => {
    const result = {
      viewport: innerWidth,
      pointer: matchMedia('(pointer:fine)').matches ? 'fine' : matchMedia('(pointer:coarse)').matches ? 'coarse' : 'none',
      hover: matchMedia('(hover:hover)').matches,
    };
    for (const [name, selector] of Object.entries(SELECTORS)) {
      // The first visible one: at a phone width the header actions live in the menu panel.
      const el = [...document.querySelectorAll(selector)].find((e) => e.getBoundingClientRect().width > 0) || document.querySelector(selector);
      if (el) result[name] = read(el);
    }
    window.__MD132__ = result;
    document.getElementById('out').textContent = JSON.stringify(result, null, 2);
    return result;
  };
  window.__hover = (name) => JSON.stringify(read([...document.querySelectorAll(SELECTORS[name])].find((e) => e.getBoundingClientRect().width > 0)));
  // At a phone width the menu button shows and the actions sit in its panel: open it, then measure.
  window.__open = () => { const m = document.querySelector('.ef-site-header__menu'); if (m && m.getBoundingClientRect().width > 0 && m.getAttribute('aria-expanded') === 'false') m.click(); };
  requestAnimationFrame(() => requestAnimationFrame(() => window.__measureMD132()));
</script>
</body>
</html>
