# Managed by the Meridian development deploy. Do not hand-edit on the server.
server {
    listen 80;
    listen [::]:80;
    server_name dev-meridian.efolusi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dev-meridian.efolusi.com;
    include snippets/efolusi-ssl.conf;

    root /var/www/efolusi/meridian-dev/current;
    index index.html;
    error_page 404 /404.html;

    add_header X-Meridian-Environment development always;
    # This host is a preview of unreleased work and must never be indexed next
    # to meridian.efolusi.com. The published bytes are identical on both hosts
    # (the deploy publishes an exact `git archive`), so the split lives here,
    # keyed on server_name.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # The committed /robots.txt is production's policy. Override it for this
    # host only: disallow everything, and advertise no sitemap — the tracked
    # file's Sitemap: line points at meridian.efolusi.com.
    location = /robots.txt {
        default_type text/plain;
        add_header X-Meridian-Environment development always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, max-age=0" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Every committed page carries `<meta name="robots" content="index,follow">`
    # because production needs it. Rewrite it in flight on this host. Applies to
    # text/html only (sub_filter_types default), so /robots.txt is untouched.
    sub_filter '<meta name="robots" content="index,follow">'
               '<meta name="robots" content="noindex,nofollow">';
    sub_filter_once on;

    location = /meridian-release.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Mirrors _headers: site runtime, bundle, styles and tokens must never go
    # stale. support.js re-fetches location.href on *.dc.html pages, so a
    # heuristic-cached copy renders an old release. add_header here replaces
    # the server-level header, so the environment header is repeated.
    location ~ ^/(site/|tokens/|_ds_bundle\.js$|styles\.css$) {
        add_header X-Meridian-Environment development always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location = /404.html {
        internal;
    }

    location ~ /\.git {
        deny all;
        return 404;
    }
}
