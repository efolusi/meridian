<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body style="background:var(--surface-page)">
<div id="root"></div>
<script type="text/babel">
const { Tabs, Breadcrumb, BreadcrumbItem, BreadcrumbLink, BreadcrumbList, BreadcrumbPage, BreadcrumbSeparator, SegmentedControl, Pagination, PaginationContent, PaginationEllipsis, PaginationItem, PaginationLink, PaginationNext, PaginationPrevious, PageControl, SideNav, TopNav, Menubar, MenubarMenu, MenubarTrigger, MenubarContent, MenubarItem, MenubarSeparator, MenubarShortcut, NavigationMenu, NavigationMenuList, NavigationMenuItem, NavigationMenuTrigger, NavigationMenuContent, NavigationMenuLink, NavigationMenuIndicator, Input, IconButton, Avatar, AvatarFallback, Item, ItemContent, ItemDescription, ItemMedia, ItemTitle, Steps } = window.EfolusiDesignSystem_4ffc3d;
const lbl = { fontSize: 11, fontWeight: 600, letterSpacing: '0.06em', textTransform: 'uppercase', color: 'var(--text-muted)', marginBottom: 8 };
function Demo() {
  const [tab, setTab] = React.useState('overview');
  const [range, setRange] = React.useState('30d');
  const [page, setPage] = React.useState(4);
  const [dot, setDot] = React.useState(1);
  const [nav, setNav] = React.useState('overview');
  return (
    <div style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 18 }}>
      <div><div style={lbl}>Tabs</div>
        <Tabs value={tab} onChange={setTab} items={[
          { id: 'overview', label: 'Overview', icon: 'layout-dashboard' },
          { id: 'members', label: 'Members', icon: 'users', count: 12 },
          { id: 'api', label: 'API keys', icon: 'terminal', count: 3 },
        ]} />
      </div>
      <div style={{ display: 'flex', gap: 40, alignItems: 'flex-start', flexWrap: 'wrap' }}>
        <div><div style={lbl}>Breadcrumbs</div>
          <Breadcrumb><BreadcrumbList><BreadcrumbItem><BreadcrumbLink href="#">Docs</BreadcrumbLink></BreadcrumbItem><BreadcrumbSeparator /><BreadcrumbItem><BreadcrumbLink href="#">Getting started</BreadcrumbLink></BreadcrumbItem><BreadcrumbSeparator /><BreadcrumbItem><BreadcrumbPage>Quickstart</BreadcrumbPage></BreadcrumbItem></BreadcrumbList></Breadcrumb>

        <div><div style={lbl}>SegmentedControl</div>

        <div><div style={lbl}>Pagination</div>
          <Pagination><PaginationContent>

            {[1, 2, 3, 4, 5].map(value => <PaginationItem key={value}><PaginationLink href={`#page-${value}`} isActive={page === value} onClick={event => { event.preventDefault(); setPage(value); }}>{value}</PaginationLink></PaginationItem>)}
            <PaginationItem><PaginationEllipsis /></PaginationItem>
            <PaginationItem><PaginationNext href={`#page-${page + 1}`} aria-disabled={page === 12} onClick={event => { event.preventDefault(); setPage(value => Math.min(12, value + 1)); }} /></PaginationItem>
          </PaginationContent></Pagination>
        </div>
        <div><div style={lbl}>PageControl</div>
          <PageControl count={4} index={dot} onChange={setDot} style={{ marginTop: 8 }} />

      </div>

      </div>
      <div><div style={lbl}>NavigationMenu</div>
        <NavigationMenu>
          <NavigationMenuList>
            <NavigationMenuItem value="platform"><NavigationMenuTrigger>Platform</NavigationMenuTrigger><NavigationMenuContent><NavigationMenuLink href="#automation"><strong>Automation</strong><span style={{ color: 'var(--text-secondary)' }}>Build dependable workflows.</span></NavigationMenuLink><NavigationMenuLink href="#observability"><strong>Observability</strong><span style={{ color: 'var(--text-secondary)' }}>Trace every production run.</span></NavigationMenuLink></NavigationMenuContent></NavigationMenuItem>
            <NavigationMenuItem value="resources"><NavigationMenuTrigger>Resources</NavigationMenuTrigger><NavigationMenuContent><NavigationMenuLink href="#guides">Guides</NavigationMenuLink><NavigationMenuLink href="#changelog">Changelog</NavigationMenuLink></NavigationMenuContent></NavigationMenuItem>
            <NavigationMenuItem><NavigationMenuLink href="#pricing">Pricing</NavigationMenuLink></NavigationMenuItem>
            <NavigationMenuIndicator />
          </NavigationMenuList>
        </NavigationMenu>
      </div>
      <div><div style={lbl}>SideNav + TopNav</div>
        <div style={{ display: 'flex', border: '1px solid var(--border-default)', borderRadius: 'var(--radius-md)', overflow: 'hidden', height: 260 }}>
          <SideNav logoSrc="../../assets/logo.png" brandBadge="Console" value={nav} onChange={setNav}
            groups={[
              { items: [
                { id: 'overview', label: 'Overview', icon: 'layout-dashboard' },
                { id: 'customers', label: 'Customers', icon: 'users', badge: 128 },
                { id: 'billing', label: 'Billing', icon: 'credit-card' },
              ]},
            ]}
            footer={<Item size="sm"><ItemMedia><Avatar><AvatarFallback>AO</AvatarFallback></Avatar></ItemMedia><ItemContent><ItemTitle>Ada Obi</ItemTitle><ItemDescription>Acme Workspace</ItemDescription></ItemContent></Item>} />
          <div style={{ flex: 1, background: 'var(--surface-page)' }}>
            <TopNav title="Overview">
              <Input size="sm" placeholder="Search… ⌘K" iconLeft="search" style={{ width: 200 }} />
              <IconButton icon="bell" label="Notifications" />
              <Avatar><AvatarFallback>AO</AvatarFallback></Avatar>
            </TopNav>
          </div>
        </div>
      </div>
      <div style={{ width: 340 }}>
        <Steps current={1} items={[
          { title: 'Connect your data', description: 'Read-only warehouse credentials.' },
          { title: 'Pick an agent', description: 'Start from a template or blank.' },
          { title: 'First run', description: 'Review the plan before it executes.' },
        ]} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
