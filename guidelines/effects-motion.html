<!-- @dsCard group="Effects" viewport="700x150" name="Motion" subtitle="Fast settles, quick exits" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;background:var(--surface-page);font-family:var(--font-sans);color:var(--text-primary)}@keyframes pop{0%,20%{transform:scale(var(--motion-enter-scale-sm));opacity:0}60%,100%{transform:scale(1);opacity:1}}@keyframes slide{0%,20%{transform:translateX(-14px);opacity:0}60%,100%{transform:translateX(0);opacity:1}}</style></head><body style="padding:14px 16px"><div style="display:flex;gap:20px;align-items:center"><div style="flex:1"><div style="height:56px;display:flex;align-items:center;justify-content:center"><div style="width:40px;height:40px;border-radius:10px;background:var(--accent);animation:pop 2.2s var(--ease-enter) infinite"></div></div><div style="font-family:var(--font-mono);font-size:9px;color:var(--text-secondary);text-align:center">--ease-enter · enters, exits, state</div></div><div style="flex:1"><div style="height:56px;display:flex;align-items:center;justify-content:center"><div style="width:40px;height:40px;border-radius:10px;background:var(--cocoa-700);animation:slide 2.2s var(--ease-emphasised) infinite"></div></div><div style="font-family:var(--font-mono);font-size:9px;color:var(--text-secondary);text-align:center">--ease-emphasised · the Switch thumb only</div></div><div style="flex:1.2;font-size:11px;color:var(--text-muted);line-height:1.6">120 / 200 / 250ms, 400ms for a modal. Press 0.98.<br>Ease-out, no bounce. Motion confirms an action; it never plays for its own sake.</div></div></body></html>
