<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body style="background:var(--surface-page)">
<div id="root"></div>
<script type="text/babel">
const { DropdownMenu, DropdownMenuTrigger, DropdownMenuContent, DropdownMenuItem, DropdownMenuSeparator, DropdownMenuShortcut, Popover, Drawer, CommandDialog, CommandInput, CommandList, CommandEmpty, CommandGroup, CommandItem, CommandShortcut, ContextMenu, ContextMenuTrigger, ContextMenuContent, ContextMenuItem, ContextMenuCheckboxItem, ContextMenuSeparator, ContextMenuShortcut, ContextMenuSub, ContextMenuSubTrigger, ContextMenuSubContent, HoverCard, HoverCardTrigger, HoverCardContent, Button, IconButton, Input, Select, Checkbox, Divider, Kbd, Avatar, Icon } = window.EfolusiDesignSystem_4ffc3d;
function Demo() {
  const [drawer, setDrawer] = React.useState(true);
  const [cmdk, setCmdk] = React.useState(false);
  return (
    <div style={{ padding: 20, display: 'flex', gap: 12, alignItems: 'flex-start', flexWrap: 'wrap' }}>
      <DropdownMenu><DropdownMenuTrigger asChild><Button variant="secondary" iconRight="chevron-down">Actions</Button></DropdownMenuTrigger><DropdownMenuContent align="start">
        <DropdownMenuItem>Edit</DropdownMenuItem><DropdownMenuItem>Duplicate<DropdownMenuShortcut>⌘D</DropdownMenuShortcut></DropdownMenuItem><DropdownMenuItem>Export CSV</DropdownMenuItem><DropdownMenuSeparator /><DropdownMenuItem variant="destructive">Delete</DropdownMenuItem>
      </DropdownMenuContent></DropdownMenu>
      <Popover trigger={<Button variant="secondary" iconLeft="funnel">Filter</Button>} width={260}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
          <Select label="Plan" size="sm" options={['Any', 'Starter', 'Growth', 'Scale']} />
          <Checkbox defaultChecked label="Active only" />
          <Divider />
          <Button size="sm" fullWidth>Apply filters</Button>
        </div>
      </Popover>
      <Button variant="secondary" iconLeft="panel-left" onClick={() => setDrawer(true)}>Open drawer</Button>
      <Button variant="secondary" iconLeft="search" onClick={() => setCmdk(true)}>Command palette&nbsp;<Kbd>⌘</Kbd><Kbd>K</Kbd></Button>
      <CommandDialog open={cmdk} onOpenChange={setCmdk} title="Workspace commands">
        <CommandInput placeholder="Type a command or search…" />
        <CommandList><CommandEmpty>No matching commands.</CommandEmpty>
          <CommandGroup heading="Actions">
            <CommandItem value="new-project" onSelect={() => setCmdk(false)}><Icon name="plus" size={16} />New project</CommandItem>
            <CommandItem value="invite" onSelect={() => setCmdk(false)}><Icon name="mail" size={16} />Invite teammate<CommandShortcut>Settings</CommandShortcut></CommandItem>
            <CommandItem value="rotate-key" onSelect={() => setCmdk(false)}><Icon name="key" size={16} />Rotate API key<CommandShortcut>Infrastructure</CommandShortcut></CommandItem>
          </CommandGroup>
          <CommandGroup heading="Go to">
            <CommandItem value="agents" onSelect={() => setCmdk(false)}><Icon name="bot" size={16} />AI agents</CommandItem>
            <CommandItem value="infrastructure" onSelect={() => setCmdk(false)}><Icon name="server" size={16} />Infrastructure</CommandItem>
            <CommandItem value="trading" onSelect={() => setCmdk(false)}><Icon name="chart-candlestick" size={16} />Trading</CommandItem>
          </CommandGroup>
        </CommandList>
      </CommandDialog>
      <ContextMenu>
        <ContextMenuTrigger asChild><div tabIndex={0} style={{ padding: '8px 14px', border: '1px dashed var(--border-strong)', borderRadius: 'var(--radius-sm)', fontSize: 13, color: 'var(--text-secondary)', userSelect: 'none' }}>Right-click project</div></ContextMenuTrigger>
        <ContextMenuContent>
          <ContextMenuItem>Rename<ContextMenuShortcut>F2</ContextMenuShortcut></ContextMenuItem>
          <ContextMenuItem>Duplicate<ContextMenuShortcut>⌘D</ContextMenuShortcut></ContextMenuItem>
          <ContextMenuCheckboxItem defaultChecked>Pin to sidebar</ContextMenuCheckboxItem>
          <ContextMenuSub><ContextMenuSubTrigger>Move to workspace</ContextMenuSubTrigger><ContextMenuSubContent><ContextMenuItem>Operations</ContextMenuItem><ContextMenuItem>Research</ContextMenuItem></ContextMenuSubContent></ContextMenuSub>
          <ContextMenuSeparator />
          <ContextMenuItem variant="destructive">Delete</ContextMenuItem>
        </ContextMenuContent>
      </ContextMenu>
      <HoverCard>
        <HoverCardTrigger asChild><Button variant="ghost">@ada</Button></HoverCardTrigger>
        <HoverCardContent align="start" style={{ width: 280 }}>
          <div style={{ display: 'flex', gap: 12 }}>
            <Avatar name="Ada Obi" size={40} />
            <div style={{ fontSize: 13.5 }}>
              <div style={{ fontWeight: 600 }}>Ada Obi</div>
              <div style={{ color: 'var(--text-muted)' }}>Owner · Acme Workspace</div>
              <div style={{ marginTop: 6, color: 'var(--text-secondary)' }}>Shipped 12 agent runs this week.</div>
            </div>
          </div>
        </HoverCardContent>
      </HoverCard>
      <Drawer open={drawer} onClose={() => setDrawer(false)} title="Customer details" width={340}
        footer={<React.Fragment><Button variant="ghost" onClick={() => setDrawer(false)}>Cancel</Button><Button onClick={() => setDrawer(false)}>Save changes</Button></React.Fragment>}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
          <Input label="Company" defaultValue="Acme Robotics" />
          <Select label="Plan" options={['Starter', 'Growth', 'Scale']} defaultValue="Growth" />
          <Input label="Billing email" defaultValue="ada@acmerobotics.com" iconLeft="mail" />
        </div>
      </Drawer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
setTimeout(() => { const b = document.querySelector('.ef-menu button'); if (b) b.click(); }, 600);
</script></body></html>
