name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels its stale run. Push runs are never cancelled:
# prod deploy and publish wait for the checks run at their exact SHA.
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# GitHub-hosted: Meridian is public, so every job runs on hosted runners, free
# and unlimited, and a fork PR never reaches a self-hosted host.

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26.13.1'
      - name: Install build dependency
        run: npm ci --no-audit --no-fund

      # The one gate list (scripts/check_all.mjs), the same command publish runs,
      # so a green PR cannot fail the release on a gate CI skipped.
      - name: All generators and gates (npm run check)
        run: npm run check

  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Browsers and their system libs come from the Playwright image, so the
      # smoke run and the baselines render with the same pinned browsers (docker
      # run as the runner uid, so the workspace never gets root-owned files).
      # Tag matches playwright@1.48.0; the digest stops a re-pushed tag from
      # changing the image.
      PW_IMAGE: mcr.microsoft.com/playwright:v1.48.0-noble@sha256:d1e54d0cbb2d6b125b0bbd32536b2ed53953ea78159c27a56f22b10058e733c4
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26.13.1'
      # axe-core comes from package.json and the lockfile (integrity checked),
      # so it is installed with npm ci, not by version on the command line.
      - name: Install build dependencies (npm ci)
        run: npm ci --no-audit --no-fund
      # smoke_headless.mjs imports from 'playwright', so the
      # package has to be resolvable from the repo. `npx --package=X node script`
      # does not put X on the module search path, which is why this job failed
      # silently for weeks while the gates job stayed green. Install it for real.
      - name: Install Playwright package (browsers come from the image)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.48.0
          docker pull -q "$PW_IMAGE"
          # The single quotes are on purpose: the variables expand inside the container, not here.
          # shellcheck disable=SC2016
          {
            echo '#!/bin/sh'
            echo 'exec docker run --rm --network host --ipc host --user "$(id -u):$(id -g)" -e HOME=/tmp -e BASE -e SHOTS -e BUTTON_SHOTS -e DIRECTION -e A11Y_GROUPS -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -v "$RUNNER_TEMP:$RUNNER_TEMP" -w "$GITHUB_WORKSPACE" "$PW_IMAGE" node "$@"'
          } > "$RUNNER_TEMP/pw-node"
          chmod +x "$RUNNER_TEMP/pw-node"
      - name: Button anchor cascade and state parity
        run: BUTTON_SHOTS="$RUNNER_TEMP/button-shots" "$RUNNER_TEMP/pw-node" scripts/check_button_cascade.mjs
      - name: Label and icon gap measured in the rendered controls
        run: '"$RUNNER_TEMP/pw-node" scripts/check_label_icon_gap.mjs'
      - name: Reduced motion keeps the token fade and the loading loops, and stops the other loops
        run: '"$RUNNER_TEMP/pw-node" scripts/check_reduced_motion.mjs'
      - name: Menus take focus, answer the keyboard and keep text clear of the mark
        run: '"$RUNNER_TEMP/pw-node" scripts/check_menu_focus.mjs'
      - name: Button renders a link with the button's look and link semantics
        run: '"$RUNNER_TEMP/pw-node" scripts/check_button_link.mjs'
      - name: Upload button interaction receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: button-interaction-receipts
          path: ${{ runner.temp }}/button-shots
          if-no-files-found: error
      - name: Serve repo and run headless smoke
        run: |
          python3 scripts/serve_static.py 8000 127.0.0.1 &
          SERVER=$!
          for _ in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8000/site/_smoke.html >/dev/null; then break; fi
            sleep 0.5
          done
          set +e
          BASE=http://127.0.0.1:8000 SHOTS="$RUNNER_TEMP/shots" "$RUNNER_TEMP/pw-node" scripts/smoke_headless.mjs
          CODE=$?
          if [ "$CODE" -eq 0 ]; then
            BASE=http://127.0.0.1:8000 DIRECTION=rtl "$RUNNER_TEMP/pw-node" scripts/smoke_headless.mjs
            CODE=$?
          fi
          if [ "$CODE" -eq 0 ]; then
            BASE=http://127.0.0.1:8000 "$RUNNER_TEMP/pw-node" scripts/smoke_starters.mjs
            CODE=$?
          fi
          if [ "$CODE" -eq 0 ]; then
            # axe-core over every demo group, light and dark.
            BASE=http://127.0.0.1:8000 A11Y_GROUPS=all "$RUNNER_TEMP/pw-node" scripts/a11y.mjs
            CODE=$?
          fi
          set -e
          kill $SERVER 2>/dev/null || true
          exit $CODE

      # Compares against tests/__shots__ baselines; skips loudly while none
      # exist. Baselines are made by the update-visual-baselines workflow so
      # they always come from this same runner platform.
      - name: Visual regression (group screenshots vs baselines)
        run: SHOTS="$RUNNER_TEMP/shots" "$RUNNER_TEMP/pw-node" scripts/check_visual.mjs

      - name: Upload shots and diffs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
