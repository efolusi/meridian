# Security headers for the Meridian vhosts. nginx drops server-level add_header
# in any location that sets its own, so include this in each such location too.
# Needs meridian-cors.conf at server level for $meridian_cors.
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Access-Control-Allow-Origin $meridian_cors always;
