<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body style="background:var(--surface-page)">
<div id="root"></div>
<script type="text/babel">
const { Table, Stat, Empty, EmptyContent, EmptyDescription, EmptyHeader, EmptyMedia, EmptyTitle, Skeleton, Card, CardContent, CardDescription, CardHeader, CardTitle, Badge, Button, Avatar, AvatarFallback, LineChart, DonutChart, Sparkline, BarChart, KeyValueList, StatusDot, Icon } = window.EfolusiDesignSystem_4ffc3d;
const rows = [
  { id: 1, name: 'Acme Robotics', plan: 'Growth', mrr: '$1,240', status: 'Active' },
  { id: 2, name: 'Bloom Health', plan: 'Scale', mrr: '$3,860', status: 'Active' },
  { id: 3, name: 'Everline', plan: 'Scale', mrr: '$2,410', status: 'Past due' },
];
const days = [42,55,48,61,58,72,66,80,74,88,92,84,96,90,104,98,112,108,118,124,130,138].map((v, i) => ({ label: 'Day ' + (i + 1), value: v * 113 }));
function Demo() {
  return (
    <div style={{ padding: 20, display: 'flex', flexDirection: 'column', gap: 18 }}>
      <div style={{ display: 'flex', gap: 16 }}>
        <Card style={{ flex: 1, '--card-spacing': '16px' }}><CardContent><Stat label="Monthly recurring revenue" value="$48.2k" delta="12.4%" direction="up" /></CardContent></Card>
        <Card style={{ flex: 1, '--card-spacing': '16px' }}><CardContent><Stat label="Churn" value="1.9%" delta="0.4pt" direction="down" hint="Rolling 30 days" /></CardContent></Card>
        <Card style={{ flex: 1, '--card-spacing': '16px' }}><CardContent><Stat label="Requests / day" value="16.3M" /></CardContent></Card>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 16 }}>
        <Card style={{ '--card-spacing': '16px' }}><CardHeader><CardTitle>API requests</CardTitle><CardDescription>Last 22 days</CardDescription></CardHeader><CardContent><LineChart data={days} height={130} format={v => v.toLocaleString()} /></CardContent></Card>
        <Card style={{ '--card-spacing': '16px' }}><CardHeader><CardTitle>Revenue by surface</CardTitle></CardHeader><CardContent><DonutChart size={124} centerValue="$48.2k" centerLabel="MRR" data={[
            { label: 'AI agents', value: 21000 }, { label: 'Infrastructure', value: 14000 }, { label: 'Trading', value: 8200 }, { label: 'Automation', value: 5000 },
          ]} /></CardContent></Card>
      </div>
      <Card><CardContent style={{ paddingInline: 0, marginBlock: 'calc(var(--card-spacing) * -1)' }}>
        <Table rowKey="id" onRowClick={() => {}} columns={[
          { key: 'name', label: 'Customer', render: (v) => <span style={{ display: 'inline-flex', alignItems: 'center', gap: 8, fontWeight: 600 }}><Avatar size="sm"><AvatarFallback>{v.split(/\s+/).map(part => part[0]).slice(0, 2).join('')}</AvatarFallback></Avatar>{v}</span> },
          { key: 'plan', label: 'Plan' },
          { key: 'status', label: 'Status', render: v => <Badge className={v === 'Active' ? 'ef-badge--success' : 'ef-badge--warning'}><Icon name="circle" size={7} strokeWidth={4} data-icon="inline-start" />{v}</Badge> },
          { key: 'mrr', label: 'MRR', numeric: true, align: 'right' },
        ]} rows={rows} />
      </CardContent></Card>
      <div style={{ display: 'grid', gridTemplateColumns: '1.2fr 1fr', gap: 16 }}>
        <Empty className="ef-empty--bordered"><EmptyHeader><EmptyMedia variant="icon"><Icon name="folder" size={24} /></EmptyMedia><EmptyTitle>Create your first project</EmptyTitle><EmptyDescription>Projects group keys, environments, and usage.</EmptyDescription></EmptyHeader><EmptyContent><Button size="sm" iconLeft="plus">New project</Button></EmptyContent></Empty>
        <Card style={{ '--card-spacing': '16px' }}><CardContent>
          <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
            <Skeleton style={{ width: 32, height: 32, borderRadius: 'var(--radius-full)' }} />
            <div style={{ flex: 1, display: 'grid', gap: 8 }}><Skeleton style={{ width: '100%', height: 12 }} /><Skeleton style={{ width: '60%', height: 12 }} /></div>
          </div>
          <Skeleton style={{ width: '100%', height: 56, marginTop: 14 }} />
        </CardContent></Card>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
        <Card style={{ '--card-spacing': '16px' }}><CardHeader><CardTitle>Weekly runs</CardTitle></CardHeader><CardContent><BarChart height={130} highlightLast={1} labels={['Mon','Tue','Wed','Thu','Fri','Sat','Sun']} data={[42,58,51,74,66,30,89]} format={v => v + ' runs'} /></CardContent></Card>
        <Card style={{ '--card-spacing': '16px' }}><CardHeader><CardTitle>Resource</CardTitle></CardHeader><CardContent><KeyValueList labelWidth={120} items={[
            { label: 'Status', value: <Badge className="ef-badge--success"><Icon name="circle" size={7} strokeWidth={4} data-icon="inline-start" />Healthy</Badge> },
            { label: 'Region', value: 'eu-west-1' },
            { label: 'Endpoint', value: 'api.acme.efolusi.com', mono: true },
          ]} /></CardContent></Card>
      </div>
      <div style={{ display: 'flex', gap: 22, flexWrap: 'wrap' }}>
        <StatusDot status="ok" label="API" />
        <StatusDot status="busy" pulse label="Deploying" />
        <StatusDot status="warn" label="Queue depth" />
        <StatusDot status="err" label="Webhooks" />
        <StatusDot status="off" label="Sandbox" />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
